name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
      - name: Build
        run: |
          cd rust-core
          cargo build --locked --verbose
      - name: Run tests
        run: |
          cd rust-core
          cargo test --locked --verbose
